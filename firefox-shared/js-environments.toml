# Firefox's JS environments, for mozsearch's js-environments tool (see its
# tools/src/js_environments/): which global a test's scripts run in, after
# which harness scripts, by the moz.build variables declaring their test
# manifests; the URLs tests load files at; and web-platform-tests' harness.

# The globals with a `load(path)` function.
load_globals = ["xpcshell", "js-shell"]

# The scripts whose functions are in functions they call at once, exposing
# them as their global's properties, which their projects unwrap, so that
# their declarations are the globals their tests see (by globs): wpt's
# harness's (testharness.js's `expose(promise_test, 'promise_test')`,
# testdriver.js's `window.test_driver = ...`), and SpiderMonkey's tests'
# helpers (`global.assertEqArray = assertEqArray`,
# `globalThis.assertDeepEq = ...`).
unwrap = [
  "testing/web-platform/tests/resources/*.js",
  "js/src/tests/shell.js",
  "js/src/tests/non262/**/shell.js",
]

[[flavors]]
name = "xpcshell"
manifest_variables = ["XPCSHELL_TESTS_MANIFESTS"]
global = "xpcshell"
# (testing/xpcshell/head.js, then the manifest's `head` files, then the test;
# see runxpcshelltests.py.)
harness = ["testing/xpcshell/head.js"]

[[flavors]]
name = "mochitest"
manifest_variables = ["MOCHITEST_MANIFESTS"]
global = "window"

[[flavors]]
name = "mochitest-chrome"
manifest_variables = ["MOCHITEST_CHROME_MANIFESTS"]
global = "chrome-window"

[[flavors]]
name = "a11y"
manifest_variables = ["A11Y_MANIFESTS"]
global = "chrome-window"

[[flavors]]
name = "browser-chrome"
manifest_variables = ["BROWSER_CHROME_MANIFESTS"]
global = "browser-window"
# (browser-test.js's test scope, with the scripts it loads into it, and the
# test's directory's head.js, which it loads whether or not the manifest says
# so; see its `Tester.prototype.execTest`.)
harness = [
  "testing/mochitest/browser-test.js",
  "testing/mochitest/chrome-harness.js",
  "testing/modules/Mochia.js",
]
implicit_head = ["head.js"]
# (A test runs in a testScope object, not in the window: its members, and the
# modules' exports the Tester copies into it, are the names it sees first; see
# `Tester.prototype.execTest`.  browser-test.js, which the window loads, and
# chrome-harness.js and Mochia.js, which it loads into the scope, are the
# harness.)
[flavors.scope]
file = "testing/mochitest/browser-test.js"
constructor = "testScope"
modules = { ContentTask = "resource://testing-common/ContentTask.sys.mjs", BrowserTestUtils = "resource://testing-common/BrowserTestUtils.sys.mjs", TestUtils = "resource://testing-common/TestUtils.sys.mjs", Assert = "new resource://testing-common/Assert.sys.mjs" }

# SpiderMonkey's tests, which its own runners find by their paths: jit-tests
# run in the JS shell after jit-test/lib/prologue.js, and load jit-test/lib's
# scripts as `load(libdir + "x.js")` (see js/src/tests/lib/jittests.py);
# jstests run after the shell.js of each of their directories, from
# js/src/tests's down (see js/src/tests/lib/tests.py's `prefix_command`).
[[path_flavors]]
name = "jit-test"
include = ["js/src/jit-test/tests/**/*.js"]
global = "js-shell"
harness = ["js/src/jit-test/lib/prologue.js"]
variables = { libdir = "js/src/jit-test/lib/", scriptdir = "{dir}" }

[[path_flavors]]
name = "jstests"
include = ["js/src/tests/**/*.js"]
exclude = ["**/shell.js", "**/browser.js", "js/src/tests/lib/**", "js/src/tests/*.js"]
global = "js-shell"
dir_heads_root = "js/src/tests"
dir_heads = ["shell.js"]

# URL prefixes, and the directories of the files they load ("" is the tree's
# root): mochitest serves tests at /tests/<their path>, and SimpleTest at
# /tests/SimpleTest/; chrome tests are at chrome://mochitests/content/<flavor>/;
# browser tests' support files are at <origin>/browser/<their path>.
[urls]
"/tests/" = ""
"/tests/SimpleTest/" = "testing/mochitest/tests/SimpleTest/"
"chrome://mochikit/content/" = "testing/mochitest/"
"chrome://mochikit/content/tests/SimpleTest/" = "testing/mochitest/tests/SimpleTest/"
"chrome://mochitests/content/chrome/" = ""
"chrome://mochitests/content/browser/" = ""
"chrome://mochitests/content/a11y/" = ""
"http://mochi.test:8888/tests/" = ""
"http://mochi.test:8888/tests/SimpleTest/" = "testing/mochitest/tests/SimpleTest/"
"https://example.com/tests/" = ""
"http://example.com/tests/" = ""
"https://example.org/tests/" = ""
"http://example.org/tests/" = ""
"https://example.com/browser/" = ""
"http://example.com/browser/" = ""
"https://example.org/browser/" = ""
"http://example.org/browser/" = ""
"https://example.net/browser/" = ""
"http://example.net/browser/" = ""
"/_mozilla/" = "testing/web-platform/mozilla/tests/"

# web-platform-tests, as its manifest and server have them
# (tools/manifest/sourcefile.py, tools/serve/serve.py): `.any.js` tests'
# variants, `.window.js` and `.worker.js` tests, `.extension.js` tests (after
# ExtensionHandler's scripts), pages with scripts or event handlers (with
# their inline scripts'), its other root's (/_mozilla/), and its Test262 tests
# (Test262WindowTestBaseHandler's: the reporter, assert.js, sta.js and the
# provider, then each test's frontmatter's includes, and doneprintHandle.js
# for an async one).
[wpt]
root = "testing/web-platform/tests"
window_harness = ["resources/testharness.js", "resources/testharnessreport.js"]
worker_harness = ["resources/testharness.js"]
extension_harness = ["resources/testharness.js", "resources/testharnessreport.js", "resources/testdriver.js", "resources/testdriver-vendor.js", "resources/web-extensions-helper.js"]
extra_roots = { "/_mozilla/" = "testing/web-platform/mozilla/tests" }

[wpt.test262]
tests = ["third_party/test262/test", "infrastructure/test262"]
harness = ["resources/test262/test262-reporter.js", "third_party/test262/harness/assert.js", "third_party/test262/harness/sta.js", "resources/test262/test262-provider.js"]
includes_dir = "third_party/test262/harness"
async_harness = ["third_party/test262/harness/doneprintHandle.js"]

# Each global kind's TypeScript types, for its environments' projects: Gecko's
# (tools/@types: its DOM, XPCOM and modules) in its windows and in xpcshell;
# TypeScript's own in workers (Gecko has no worker types) and in the JS shell.
# (Gecko's DOM is tools/@types' lib replacement, the package.json's
# @typescript/lib-dom, which mozsearch's js-environments-analyze.sh links for
# the projects.)  Web content's (web-platform-tests' and plain mochitests')
# without the paths of Gecko's chrome:// and resource:// modules, which its
# tests can't import: the module types of tools/@types' typings add them all
# (1,938 files, 45 MB) to each program otherwise, which made web-platform-tests'
# projects 3.2 times as slow to index, for 0.01% more of their references.
[globals.window]
extends = "tools/@types/tsconfig.json"
compiler_options = { paths = {} }
[globals.chrome-window]
extends = "tools/@types/tsconfig.json"
[globals.browser-window]
extends = "tools/@types/tsconfig.json"
[globals.xpcshell]
extends = "tools/@types/tsconfig.json"
[globals.chromeworker]
lib = ["ESNext", "WebWorker"]
[globals.dedicatedworker]
lib = ["ESNext", "WebWorker"]
[globals.sharedworker]
lib = ["ESNext", "WebWorker"]
[globals.serviceworker]
lib = ["ESNext", "WebWorker"]
[globals.js-shell]
lib = ["ESNext"]

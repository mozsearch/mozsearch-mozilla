# Overrides for the wubspecs tree's specs.toml, which mozsearch's
# scripts/browser-specs-to-toml.py generates from browser-specs' index:
#
#   scripts/browser-specs-to-toml.py config/wubspecs/specs-overrides.toml \
#     config/wubspecs/specs.toml --respec

# The forest's root .gitattributes: specs' HTML-based sources are tokenized as
# such for history (see tools/src/tree_sitter_support/spec_tokenizer.rs),
# including the HTML Standard's `source` (and the `index` it generated, which
# its repository had until 2012), TC39 proposals' `.emu` sources, and old
# specs' XML and Anolis `.src` files, but for Bikeshed's `.src.html` sources.
# (Bikeshed's `.bs` files are tokenized as Bikeshed by default.)
attributes = """
*.html searchfox-lang=spec-html
*.htm searchfox-lang=spec-html
*.xml searchfox-lang=spec-html
*.src searchfox-lang=spec-html
*.emu searchfox-lang=spec-html
*.src.html searchfox-lang=bikeshed
html/source searchfox-lang=spec-html
html/index searchfox-lang=spec-html
"""

# The forest's directories of repositories whose names (lowercased) aren't
# them, as the forest already has them.
[directories]
"https://github.com/w3c/ServiceWorker" = "service-workers"

# Repositories (by URL) and specs (by shortname) to leave out.
exclude = []

# Outdated URLs which code still cites for specs' anchors (by the specs'
# names): old hosts' (drafts.fxtf.org's and dev.w3.org/csswg's, which
# drafts.csswg.org has now, some renamed) and the obsolete specs' they
# superseded (the W3C's HTML5 drafts', the old webapi drafts'), from
# Gecko's citations.  Citations by them are of the specs' anchors, but say
# they're by outdated URLs (see tools/src/spec_analyze/citations.rs).
[old_urls]
clipboard-apis = ["https://dev.w3.org/2006/webapi/clipops/"]
compositing-1 = ["https://dev.w3.org/fxtf/compositing-1/", "https://drafts.fxtf.org/compositing-1/"]
compositing-2 = ["https://drafts.fxtf.org/compositing/"]
css-animations-1 = ["https://dev.w3.org/csswg/css3-animations/"]
css-animations-2 = ["https://dev.w3.org/csswg/css-animations-2/"]
css-backgrounds-3 = ["https://dev.w3.org/csswg/css-backgrounds/", "https://dev.w3.org/csswg/css3-background/"]
css-break-3 = ["https://dev.w3.org/csswg/css-break/"]
css-counter-styles-3 = ["https://dev.w3.org/csswg/css-counter-styles-3/"]
css-display-3 = ["https://dev.w3.org/csswg/css-display/"]
css-flexbox-1 = ["https://dev.w3.org/csswg/css-flexbox-1/"]
css-font-loading-3 = ["https://dev.w3.org/csswg/css-font-loading/"]
css-grid-2 = ["https://dev.w3.org/csswg/css-grid/"]
css-images-3 = ["https://dev.w3.org/csswg/css-images-3/", "https://dev.w3.org/csswg/css-images/", "https://dev.w3.org/csswg/css3-images/"]
css-images-4 = ["https://dev.w3.org/csswg/css-images-4/"]
css-masking-1 = ["https://drafts.fxtf.org/css-masking-1/", "https://drafts.fxtf.org/css-masking/"]
css-position-3 = ["https://dev.w3.org/csswg/css-position/"]
css-ruby-1 = ["https://dev.w3.org/csswg/css-ruby/"]
css-syntax-3 = ["https://dev.w3.org/csswg/css-syntax/"]
css-text-3 = ["https://dev.w3.org/csswg/css-text/"]
css-transforms-1 = ["https://dev.w3.org/csswg/css-transforms/"]
css-transitions-1 = ["https://dev.w3.org/csswg/css3-transitions/"]
css-transitions-2 = ["https://dev.w3.org/csswg/css-transitions-2/"]
css-ui-4 = ["https://dev.w3.org/csswg/css-ui/"]
css-writing-modes-3 = ["https://dev.w3.org/csswg/css-writing-modes-3/"]
cssom-1 = ["https://dev.w3.org/csswg/cssom/"]
cssom-view-1 = ["https://dev.w3.org/csswg/cssom-view/"]
fileapi = ["https://dev.w3.org/2006/webapi/FileAPI/"]

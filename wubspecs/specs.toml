# The specs of the "wubspecs" tree, generated by mozsearch's
# scripts/browser-specs-to-toml.py from browser-specs' index and
# specs-overrides.toml (which to edit rather than this).  Each spec with a
# `url` is a top-level directory of the tree's forest repository, with the
# history of its upstream repository (see tools/src/spec_forest.rs and
# build-spec-forest), and those without are specs in another's repository.
#
# Each spec's `shortname` (if it's not its name; as browser-specs' series
# shortnames for current specifications) names its symbols
# (`SPEC_<shortname>_<anchor>`), its `rendered` URL (and `aliases`) is where
# its anchors are, so that references to it from other specs (and from code)
# name its symbols, and its `format` says how spec-analyze analyzes its
# source (see tools/src/spec_analyze).  Citations of anchors it doesn't
# define are of the other specs of its `series` (if it's not its shortname)
# or of its `successors`, if they define them.

attributes = """
*.html searchfox-lang=spec-html
*.htm searchfox-lang=spec-html
*.xml searchfox-lang=spec-html
*.src searchfox-lang=spec-html
*.emu searchfox-lang=spec-html
*.src.html searchfox-lang=bikeshed
html/source searchfox-lang=spec-html
html/index searchfox-lang=spec-html
"""


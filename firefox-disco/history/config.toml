# Settings for firefox-disco's token-centric history; see
# tools/src/hyperblame/history_config.rs in mozsearch.

# Deriving history for all of firefox-main (back to 1998) isn't practical yet,
# so we start at the last main commit from more than 730 days before
# 2026-09-29 (2024-09-29), which is where the history in
# firefox-shared-history.tar.lz4 starts: it was generated by reblame with
# HISTORY_WINDOW_DAYS=730 (as firefox-shared-history-2year.tar.lz4).  Sheriffs
# switched from hg-style "Backed out changeset" backouts to git reverts at the
# start of May 2025, so this spans both.  (firefox-shared-history-1year.tar.lz4
# starts at 30cf6caf99ccfad64d14fb2203a1d9e3c3e7d5ca, 400 days back.)  Changing
# this requires regenerating the history.
start = "8f896407e506049489f93d82c7fe0bfc4672fdf4"

# Settings for firefox-disco's token-centric history; see
# tools/src/hyperblame/history_config.rs in mozsearch.

# Deriving history for all of firefox-main (back to 1998) isn't practical yet,
# so we start at the last main commit from more than 400 days before
# 2026-09-28 (2025-08-24), which is where the history in
# firefox-shared-history.tar.lz4 starts: it was generated by reblame with
# HISTORY_WINDOW_DAYS=400 (as firefox-shared-history-1year.tar.lz4).  Sheriffs
# switched from hg-style "Backed out changeset" backouts to git reverts at the
# start of May 2025, so this only has git reverts; the earlier start of
# aa7f89dfca3f31132b11a48776324a9f775525d9 (the last main commit before
# 2025-04-01) spanned both.  Changing this requires regenerating the history.
start = "30cf6caf99ccfad64d14fb2203a1d9e3c3e7d5ca"
